[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strandr"
version = "0.3.0"
description = "Find which line of code stranded your GPU memory"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["torch", "nvidia-ml-py"]

[project.urls]
Homepage = "https://github.com/manu-j3400/strandr"

[tool.setuptools.packages.find]
include = ["strandr*"]
